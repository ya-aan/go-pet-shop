# See: https://taskfile.dev/api/

# For generate input command:
# task generate
# task linter
# task test
# task test-integration

version: "3"

tasks:
  generate:
    aliases: [migrate]
    desc: "Generate migrations for the database"
    dotenv: [".env"]
    cmds:
      - go run cmd/migrator/main.go --migrations-path "./migrations"
    
  linter:
    desc: "Run linters on the codebase"
    cmds:
      - golangci-lint run ./...

  test:
    desc: "Run unit tests"
    cmds:
      - go test ./...

  test-integration:
    desc: "Run PostgreSQL integration tests (needs TEST_DATABASE_URL with a separate *test* database)"
    dotenv: [".env"]
    cmds:
      - go test -tags integration -count=1 -v ./internal/storage/postgres/
